services:
  - type: web
    name: todo-api
    env: node
    plan: free

    buildCommand: |
      pnpm install --frozen-lockfile
      pnpm --filter @todo-app/shared build
      pnpm --filter api-gateway build

    startCommand: |
      pnpm --filter api-gateway start

    healthCheckPath: /health

    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true

  - type: web
    name: todo-frontend
    env: node
    plan: free
    
    buildCommand: |
      pnpm install --frozen-lockfile
      pnpm --dir apps/frontend build

    startCommand: |
      pnpm install --frozen-lockfile 
      pnpm --dir apps/frontend start 

    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        value: https://todo-frontend-8l7g.onrender.com
      - key: AUTH_TRUST_HOST
        value: "true"
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://todo-api-p1zd.onrender.com
